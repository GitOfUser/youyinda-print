server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: youyinda-backend

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/youyinda?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: root
    password: 1234
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000

  redis:
    host: localhost
    port: 6380
    password:
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

file:
  upload:
    path: uploads

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.youyinda.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: youyinda-secret-key-2024-jwt-token
  expiration: 604800000

sms:
  # dev-mode=true 时验证码仅打印日志，不真实发送短信（上线前替换为阿里云/腾讯云短信并关闭）
  dev-mode: true
  # 验证码有效期（秒）
  expire-seconds: 300

wechat:
  miniapp:
    appId: wx1234567890abcdef
    appSecret: your_app_secret_here
  pay:
    mchId: your_mch_id
    apiV3Key: your_api_v3_key
    privateKeyPath: classpath:cert/apiclient_key.pem
    privateCertPath: classpath:cert/apiclient_cert.pem
    serialNo: your_serial_no
    notifyUrl: http://localhost:8081/api/v1/pay/notify

feign:
  circuitbreaker:
    enabled: true

third-party:
  print:
    # FeignClient 默认占位 URL（实际调用由 Service 层通过 ThirdApiConfigService 动态选择）
    provider-url: https://api.print-provider.com
    providers:
      - code: xiaohou
        name: 小猴云印
        api-url: https://api.print-provider.com
        app-id: your_print_app_id
        app-secret: your_print_app_secret
        timeout: 3000
      - code: liuliuyin
        name: 66印
        api-url: https://api.66yin.com
        app-id: your_66yin_app_id
        app-secret: your_66yin_app_secret
        timeout: 3000
  express:
    # FeignClient 默认占位 URL（实际调用由 Service 层通过 ThirdApiConfigService 动态选择）
    provider-url: https://api.kuaidi100.com
    # 第三方快递不可用时降级为本地模拟单号（测试/联调环境 true；生产必须 false）
    mock-enabled: true
    providers:
      - code: kuaidi100
        name: 快递100·百递云
        api-url: https://api.kuaidi100.com
        app-id: your_kuaidi100_app_id
        app-secret: your_kuaidi100_app_secret
        timeout: 3000
  sync:
    enabled: false
    cron: "0 0 2 * * ?"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.youyinda: DEBUG
    org.springframework: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
