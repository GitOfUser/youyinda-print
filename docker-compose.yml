services:
  mysql:
    image: mysql:8.0
    container_name: youyinda-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: youyinda
      TZ: Asia/Shanghai
    ports:
      - "3309:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./youyinda-backend/src/main/resources/init.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    networks:
      - youyinda-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p1234"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:6.2-alpine
    container_name: youyinda-redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - youyinda-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./youyinda-backend
      dockerfile: Dockerfile
    container_name: youyinda-backend
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: docker
      TZ: Asia/Shanghai
    ports:
      - "8081:8081"
    volumes:
      - ./youyinda-backend/uploads:/app/uploads
      - youyinda-backend-logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - youyinda-network

  nginx:
    image: nginx:1.27-alpine
    container_name: youyinda-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./youyinda-admin:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - youyinda-network

volumes:
  mysql-data:
  redis-data:
  youyinda-backend-logs:

networks:
  youyinda-network:
    driver: bridge
